name: CI tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  phpstan:
    # Only run on a single version of Ubuntu/PHP to save GitHub CPU time.
    # PHPStan will perform the same checks irrespective of the platform.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup PHP, composer
        uses: $/.github/actions/setup-php
        with:
          php-version: '8.1'
      - name: Copy over dummy CI config file
        run: cp .github/ci_config.php ./config.php
      - name: Run PHPStan
        run: ./vendor/bin/phpstan --no-ansi --no-progress
